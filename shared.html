<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>行程协作空间</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="shared.css"></head><body>
<header><div class="shell header-inner"><a class="brand" href="./">← 公开行程</a><strong>行程协作空间</strong><span id="account"></span></div></header>
<main class="shell shared-shell"><section id="authGate"><h1>一起安排，实时同步</h1><p id="authMessage">正在检查登录状态…</p><a id="signIn" class="button dark" href="/signin-with-chatgpt?return_to=%2Fshared.html" target="_top" hidden>使用 ChatGPT 登录</a></section>
<section id="workspace" hidden><div class="section-head"><div><p class="kicker">团队共享 · 仅授权协作者可见</p><h1>行程协作</h1></div><div><p id="syncStatus" role="status" aria-live="polite"></p><a href="/signout-with-chatgpt?return_to=%2Fshared.html" target="_top">退出登录</a></div></div>
<div class="shared-grid"><nav aria-label="行程阶段"><div id="stageList"></div></nav><section><form id="sharedForm"><h2 id="stageHeading"></h2><p id="stageWindow" class="small-note"></p><label class="check-label"><input id="sharedVerified" type="checkbox"> 已核验完成</label><label>日期显示<input id="sharedDate" required maxlength="200"></label><label>城市／地点<input id="sharedCity" required maxlength="200"></label><label>核心安排<input id="sharedSummary" required maxlength="1000"></label><label>共享备注<textarea id="sharedNote" rows="5" maxlength="5000" placeholder="接待安排、临时变更或团队提醒"></textarea></label><p class="small-note">共享备注仅授权协作者可见。日期显示不改变原计划的进度日期。</p><div class="backup-actions"><button class="button dark" id="saveShared" type="submit">保存并同步</button><button class="button" id="loadLatest" type="button">载入最新版本</button><button class="button" id="undoLatest" type="button">撤销最近一次更改</button></div><p id="formMessage" role="status"></p></form><section class="history-panel"><h2>修改记录</h2><p class="small-note">恢复历史版本会新增一条记录，原有记录保留。</p><ol id="history"></ol></section></section></div>
<section id="memberPanel" class="backup-panel" hidden><div><h2>协作者</h2><p>添加助理登录 ChatGPT 时使用的邮箱，再把本页链接发给对方。此操作不会发送邮件。</p><form id="memberForm"><label>协作者邮箱<input id="memberEmail" type="email" required maxlength="254"></label><button class="button" type="submit">添加协作者</button></form><ul id="memberList"></ul><p id="memberMessage" role="status"></p></div></section>
</section></main><script src="itinerary.js" defer></script><script src="shared.js" defer></script></body></html>
