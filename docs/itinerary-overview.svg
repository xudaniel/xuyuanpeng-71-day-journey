<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1200" viewBox="0 0 1100 1200" role="img" aria-labelledby="title desc"><title id="title">七十一日行程总览</title><desc id="desc">2026年9月14日更新：赴日前全部在深圳，10月23日起日本及之后行程不变。</desc><rect width="1100" height="1200" fill="white"/><g fill="#171717" font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="60" y="75" font-size="32" font-weight="600">徐远鹏｜七十一日行程</text><text x="60" y="115" font-size="17">2026年8月25日—11月3日 · 71天 · 10个阶段</text><text x="60" y="155" font-size="18">赴日前全部在深圳 · 2026年9月14日更新</text><path d="M60 185H1040" stroke="#171717"/><text x="60" y="235" font-size="15">8月25日—9月5日</text><text x="680" y="235" font-size="23">广州 → 深圳</text><path d="M60 260H1040" stroke="#ddd"/><text x="60" y="307" font-size="15">9月6日 · 周日</text><text x="680" y="307" font-size="23">上海 · 婚礼</text><path d="M60 332H1040" stroke="#ddd"/><text x="60" y="379" font-size="15">9月7日—9月10日</text><text x="680" y="379" font-size="23">上海</text><path d="M60 404H1040" stroke="#ddd"/><text x="60" y="451" font-size="15">9月11日 · 周五</text><text x="680" y="451" font-size="23">无锡</text><path d="M60 476H1040" stroke="#ddd"/><text x="60" y="523" font-size="15">9月12日 · 周六</text><text x="680" y="523" font-size="23">南京 → 无锡</text><path d="M60 548H1040" stroke="#ddd"/><text x="60" y="595" font-size="15">9月13日（周日）—10月22日（周四）</text><text x="680" y="595" font-size="23">深圳</text><path d="M60 620H1040" stroke="#ddd"/><text x="60" y="667" font-size="15">10月23日（周五）—10月26日（周一）· 三晚</text><text x="680" y="667" font-size="23">东京／東京</text><path d="M60 692H1040" stroke="#ddd"/><text x="60" y="739" font-size="15">10月26日（周一）—10月29日（周四）· 三晚</text><text x="680" y="739" font-size="23">京都</text><path d="M60 764H1040" stroke="#ddd"/><text x="60" y="811" font-size="15">10月29日—11月2日</text><text x="680" y="811" font-size="23">深圳</text><path d="M60 836H1040" stroke="#ddd"/><text x="60" y="883" font-size="15">11月3日 · 周二</text><text x="680" y="883" font-size="23">广州 → 多伦多</text><path d="M60 908H1040" stroke="#ddd"/><text x="60" y="1030" font-size="19">9月13日—10月22日深圳 · 10月23日起日本 · 10月29日返深</text><text x="60" y="1070" font-size="16">东京与京都各三晚。接待与交通详见完整版。</text><text x="60" y="1110" font-size="16">本图为计划概览；日期经过不代表活动实际完成。</text></g></svg>