    const start=new Date(2026,7,25),end=new Date(2026,10,3),dayMs=86400000,storeKey='new-vision-itinerary-local-v1';
    const shanghaiToday=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).reduce((a,x)=>(x.type!=='literal'&&(a[x.type]=+x.value),a),{});return new Date(p.year,p.month-1,p.day)};
    const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

    function primary(city){return city.split(' → ').at(-1).split(' · ')[0]}
    function render(){
      const today=shanghaiToday(),elapsed=Math.floor((today-start)/dayMs),day=Math.min(71,Math.max(1,elapsed+1)),pct=today<start?0:today>end?100:Math.round(day/71*100);

      document.getElementById('route').innerHTML=cities.map((c,i)=>`<li><b>${String(i+1).padStart(2,'0')}</b>${c}${i<cities.length-1?'<em>→</em>':''}</li>`).join('');

      document.querySelectorAll('.main').forEach(b=>b.onclick=()=>{const row=b.closest('.row');row.classList.toggle('open');b.setAttribute('aria-expanded',row.classList.contains('open'))});document.querySelectorAll('.verify input').forEach(c=>c.onchange=()=>{c.checked?verified.add(c.dataset.start):verified.delete(c.dataset.start);saveVerified([...verified]);render()});

    function addDay(value){const d=parse(value);d.setDate(d.getDate()+1);return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`}
    function icsEscape(value){return value.replaceAll('\\','\\\\').replaceAll(';','\\;').replaceAll(',','\\,').replaceAll('\n','\\n')}
    function exportCalendar(){const stamp=new Date().toISOString().replaceAll('-','').replaceAll(':','').replace(/\.\d{3}Z$/,'Z');const events=itinerary.map(x=>['BEGIN:VEVENT',`UID:${x.start}@newvision.travel`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${x.start.replaceAll('-','')}`,`DTEND;VALUE=DATE:${addDay(x.end)}`,`SUMMARY:${icsEscape(`${x.city} · ${x.summary}`)}`,`LOCATION:${icsEscape(x.city)}`,`DESCRIPTION:${icsEscape(x.details.join('\n'))}`,'END:VEVENT'].join('\r\n'));const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//New Vision Investment//71 Day Journey//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH',...events,'END:VCALENDAR'].join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/calendar;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='徐远鹏_七十一日行程.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
