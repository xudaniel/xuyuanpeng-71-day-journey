name: Mobile OS tests
on:
  pull_request:
    paths:
      - 'os.html'
      - 'app/**'
      - 'data/**'
      - 'tests/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/mobile-os-tests.yml'
  push:
    branches: [main]
    paths:
      - 'os.html'
      - 'app/**'
      - 'data/**'
      - 'tests/**'
      - 'manifest.webmanifest'
      - 'sw.js'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app/core.mjs
          node --check app/storage.mjs
          node --check app/os.mjs
      - name: Unit tests
        run: node --test tests/os-core.test.mjs tests/storage.test.mjs
